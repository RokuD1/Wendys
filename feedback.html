<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wendy's Glassboro Customer Feedback</title>
    <link rel="stylesheet" href="StyleSheet.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Wendy's Customer Feedback</h1>
            <h2>Tell Us About Your Visit</h2>
        </header>

        <nav>
            <a href="index.html">Home</a>
            <a href="contact.html">About Us</a>
            <a href="menu.html">Menu</a>
            <a href="feedback.html">Feedback</a>
        </nav>

        <main>
            <section>
                <h3>Customer Feedback</h3>
                <p>Please fill out this form to share feedback, suggestions, and gain rewards for Wendy's Glassboro.</p>

                <form>
                    <div class="form-row">
                        <label for="full-name">Full Name:</label>
                        <input type="text" id="full-name" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-row">
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" placeholder="example@email.com" required>
                    </div>

                    <div class="form-row">
                        <label for="password">Password:</label>
                        <input type="password" id="password" placeholder="********" required>
                    </div>

                    <div class="form-row">
                        <label for="phone">Phone Number:</label>
                        <input type="tel" id="phone" placeholder="856-555-1234">
                    </div>

                    <div class="form-row">
                        <label for="visit-date">Date of Visit:</label>
                        <input type="date" id="visit-date">
                    </div>

                    <div class="form-row">
                        <label for="favorite-item">Favorite Menu Item:</label>
                        <input list="menu-items" id="favorite-item" placeholder="Choose or type an item">
                        <datalist id="menu-items">
                            <option value="Dave's Single">
                            <option value="Baconator">
                            <option value="Spicy Chicken Sandwich">
                            <option value="10 Piece Nuggets">
                            <option value="French Fries">
                            <option value="Frosty">
                        </datalist>
                    </div>

                    <div class="form-row">
                        <label for="server">Server Name:</label>
                        <input list="server-names" id="server" placeholder="Who was your server?">
                        <datalist id="server-names">
                            <option value="Wendy">
                            <option value="Ronald">
                            <option value="Grimace">
                            <option value="Colonel">
                            <option value="Chuck E.">
                        </datalist>
                    </div>

                    <fieldset>
                        <legend>How did you order?</legend>

                        <input type="radio" id="dine-in">
                        <label for="dine-in">Dine In</label>

                        <input type="radio" id="drive-thru">
                        <label for="drive-thru">Drive-Thru</label>

                        <input type="radio" id="mobile-order">
                        <label for="mobile-order">Mobile Order</label>
                    </fieldset>

                    <fieldset>
                        <legend>What are you interested in?</legend>

                        <input type="checkbox" id="rewards">
                        <label for="rewards">Rewards</label>

                        <input type="checkbox" id="updates">
                        <label for="updates">Newsletter</label>
                    </fieldset>

                    <div class="form-row">
                        <label for="comments">Comments or Suggestions:</label>
                        <textarea id="comments" rows="5" placeholder="Write your feedback here"></textarea>
                    </div>

                    <div class="button-row">
                        <input type="submit">
                        <input type="reset">
                    </div>
                </form>
            </section>
        </main>

    </div>

</body>
</html>
